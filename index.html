<!DOCTYPE html>
<html>

<head>
    <meta charset="utf-8">

    <script src="https://aframe.io/releases/1.6.0/aframe.min.js"></script>

    <script src="https://raw.githack.com/AR-js-org/AR.js/master/aframe/build/aframe-ar.js"></script>

    <style>
        body {
            margin: 0;
            overflow: hidden;
        }
    </style>
</head>

<body>

<a-scene
    embedded
    arjs="sourceType: webcam;">

    <a-assets>

        <a-asset-item id="murata" src="murata.glb"></a-asset-item>
        <a-asset-item id="teto" src="ar_dancing_teto.glb"></a-asset-item>
        <a-asset-item id="cat" src="oiiaioooooiai_cat.glb"></a-asset-item>
        <a-asset-item id="spear" src="longuinus.glb"></a-asset-item>
        <a-asset-item id="harhiroku" src="Hachiroku.glb"></a-asset-item>

    </a-assets>

    <a-marker
        id="marker"
        preset="hiro">

        <a-entity
            id="displayModel"
            position="0 0 0"
            scale="0.1 0.1 0.1">
        </a-entity>

    </a-marker>

    <a-entity camera></a-entity>

</a-scene>

<script>

const modelList = [
    "#teto",
    "#murata",
    "#cat",
    "#spear",
    "#hachiroku"
];

const marker = document.querySelector("#marker");
const displayModel = document.querySelector("#displayModel");

let wasVisible = false;

marker.addEventListener("markerFound", () => {

    if(wasVisible) return;

    wasVisible = true;

    const randomIndex =
        Math.floor(Math.random() * modelList.length);

    const selectedModel =
        modelList[randomIndex];

    displayModel.setAttribute(
        "gltf-model",
        selectedModel
    );

    displayModel.setAttribute(
        "rotation",
        `0 ${Math.floor(Math.random()*360)} 0`
    );

    console.log(
        "出現:",
        selectedModel
    );

});

marker.addEventListener("markerLost", () => {

    wasVisible = false;

});

</script>

</body>
</html>
